[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12", "pin==4.1.0", "cmeel-eigen", "cmeel-urdfdom-headers"]
build-backend = "scikit_build_core.build"

[project]
name = "libpyelite"
version = "0.1.0"
description = "Native Pink-style IK, interpolation and Elite CS66 SDK bridge"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = ["pin==4.1.0", "numpy>=1.24"]

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["libpyelite"]
build.tool-args = ["-j2"]
sdist.include = ["vendor/elite_cs_sdk/**"]
